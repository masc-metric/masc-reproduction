scorer: vqascore
# VQAScore (Lin et al., ECCV 2024). P("Yes" | image, "Does this figure
# show '{prompt}'?") via clip-flant5-xxl (~3B params).
model_id: clip-flant5-xxl
tag: dreambenchplus

sample_source: dreambenchplus
signals: ["prompt_following"]

images_root: data/dreambench_plus/images
masks_root: data/masks/dreambench_plus/refs
image_exts: [".jpg", ".jpeg", ".png"]

# Style subjects' prompts describe a visual style not a scene; PF
# semantics are different. Mirrors `clipt_base_global_bg_nosubj_*`.
skip_style: true
