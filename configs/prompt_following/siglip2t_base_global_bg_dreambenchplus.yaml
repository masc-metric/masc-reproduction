matcher: siglip2-t
model_id: google/siglip2-base-patch16-512
tag: dreambenchplus_global_bg
variant: global_bg

# BG-masked pooled PF: run SigLIP2's trained attention pooler on image
# patches but hide FG positions via key_padding_mask, so the pool only
# aggregates background patches. Cosine against the standard pooled
# text embedding. Stays in the trained joint space (the projection head
# is used as-is), unlike MaxSim which tried and failed to align
# pre-projection per-patch features with text. Tests whether the
# "prompt mainly changes the background" assumption lets us recover a
# PF signal from just the BG region.
sample_source: dreambenchplus
signals: ["prompt_following"]

images_root: data/dreambench_plus/images
masks_root: data/masks/dreambench_plus/refs
image_exts: [".jpg", ".jpeg", ".png"]

input_size: 512
