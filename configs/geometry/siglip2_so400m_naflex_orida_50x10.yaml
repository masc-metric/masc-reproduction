matcher: siglip2
model_id: google/siglip2-so400m-patch16-naflex
tag: orida_train_50x10

# Our winning CP recipe: masked_maxcos on SigLIP2 SO400M-NaFlex @ 1024 patches.
score_type: masked_maxcos
naflex_max_patches: 1024

# 50 train subjects × 10 backgrounds × 1 photo per (subject, background).
sample_source: orida_diffbg
signals: ["geometry"]

images_root: data/ORIDa/ORIDa_v1.0/train
masks_root: data/ORIDa/ORIDa_v1.0/train
image_exts: [".jpg", ".jpeg", ".png"]

input_size: 512
fg_threshold: 0.5

builder_kwargs:
  subjects_max: 50
  backgrounds_per_subject: 10
